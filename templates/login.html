<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    color:#ffffff;
}

/* Navbar Same as Index */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:rgba(0,0,0,0.25);
}

.navbar h2{
    margin:0;
    color:#ffffff;
    font-size:32px;
    font-weight:700;
}

.home-btn{
    background:#facc15;
    color:#000;
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
}

.home-btn:hover{
    color:#000;
    background:#fde047;
}

/* Center Login Box */
.wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:calc(100vh - 70px);
    padding:20px;
}

.login-box{
    width:100%;
    max-width:460px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:22px;
    padding:40px;
    box-shadow:0 20px 45px rgba(0,0,0,0.25);
}

/* Title */
.login-box h2{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    color:#ffffff;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:#e2e8f0;
    margin-bottom:28px;
    font-size:18px;
}

/* Inputs */
.form-control{
    border:none;
    border-radius:12px;
    padding:14px 16px;
    font-size:18px;
    margin-bottom:18px;
    color:#111827;
}

.form-control:focus{
    box-shadow:0 0 0 3px rgba(59,130,246,0.25);
}

/* Button Same Style */
.btn-main{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:600;
    transition:0.3s ease;
}

.btn-main:hover{
    background:#1d4ed8;
    color:white;
    box-shadow:0 8px 20px rgba(37,99,235,0.35);
    transform:translateY(-2px);
}

/* Error */
.alert{
    border-radius:12px;
    font-size:16px;
}

/* Back Link */
.back-link{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#facc15;
    text-decoration:none;
    font-size:17px;
    font-weight:500;
}

.back-link:hover{
    color:#fde047;
}

/* Mobile */
@media(max-width:576px){
    .login-box{
        padding:28px;
    }

    .login-box h2{
        font-size:30px;
    }

    .navbar h2{
        font-size:24px;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <h2>Complaint System</h2>
    <a href="/" class="home-btn">Home</a>
</div>

<!-- Login Box -->
<div class="wrapper">
    <div class="login-box">

        <h2>Admin Login</h2>
        <p>Secure dashboard access</p>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <input type="text" name="username" class="form-control" placeholder="Username" required>

            <input type="password" name="password" class="form-control" placeholder="Password" required>

            <button type="submit" class="btn-main">Login</button>

        </form>

        <a href="/" class="back-link">← Back to Home</a>

    </div>
</div>

</body>
</html>
